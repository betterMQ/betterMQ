<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BetterMQ API Reference</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0a0a;
    }
    #app {
      height: 100%;
      width: 100%;
      overflow: auto;
    }
    /* Keep decorative flare out of document flow (avoids ~100vh blank gap) */
    .section-flare {
      position: fixed !important;
      inset: 0 auto auto 0 !important;
      width: 0 !important;
      height: 0 !important;
      overflow: hidden !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="/docs/scalar.js"></script>
  <script>
    (function () {
      const openapiUrl = new URL("/openapi.json", window.location.href).href;
      Scalar.createApiReference("#app", {
        url: openapiUrl,
        theme: "none",
        layout: "modern",
        darkMode: true,
        withDefaultFonts: false,
      });
    })();
  </script>
</body>
</html>
