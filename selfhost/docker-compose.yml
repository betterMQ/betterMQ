# Self-host: single node, local WAL + RocksDB.
#
# Prefers the published image (no Rust toolchain needed):
#   cd selfhost && docker compose up -d
#
# Build from source instead:
#   docker compose up -d --build
#
#   open http://localhost:8080/panel/
#
# The container listens on 0.0.0.0:8080 (published to the host). For internet
# exposure, put a reverse proxy in front and prefer binding the host to 127.0.0.1.
#
# Configure storage and cluster from Panel → Infrastructure (no config file mount).

services:
  bettermq:
    image: ghcr.io/bettermq/bettermq:latest
    build:
      context: ..
      dockerfile: selfhost/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - bettermq-data:/data
    command: ["serve", "--data-dir", "/data"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  bettermq-data:
