# Self-host: single node + MinIO + SlateDB (panel configures S3 — no JSON mount).
#
#   cd selfhost && docker compose -f docker-compose.slate.yml up -d --build
#   open http://localhost:8080/panel/ → Infrastructure → SlateDB
#   MinIO (internal only): endpoint http://minio:9000  buckets bettermq + bettermq-payloads
#
# HONESTY: this compose runs a **single MinIO**. That is fine for laptop/dev and
# single-node Slate. It is **not** multi-AZ object-store HA. For real HA, use a
# managed S3/R2 (or a multi-node MinIO deployment) and 3+ brokers.
#
# SECURITY: MinIO ports are NOT published to the host. Override with a compose
# override file only for local debugging. Change MINIO_ROOT_* for anything beyond
# a throwaway laptop.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    # Internal compose network only — do not publish 9000/9001 on untrusted hosts.
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
        until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" 2>/dev/null; do sleep 1; done;
        mc mb --ignore-existing local/bettermq;
        mc mb --ignore-existing local/bettermq-payloads;
        echo buckets ready;
      "

  bettermq:
    image: ghcr.io/bettermq/bettermq:latest
    build:
      context: ..
      dockerfile: selfhost/Dockerfile
    ports:
      - "8080:8080"
    environment:
      BETTERMQ_CLUSTER_SECRET: ${BETTERMQ_CLUSTER_SECRET:-}
    volumes:
      - bettermq-data:/data
    command: ["serve", "--data-dir", "/data"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

volumes:
  minio-data:
  bettermq-data:
