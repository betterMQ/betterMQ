[package]
name = "bettermq-loadgen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP ingest load generator for BetterMQ (broker-only friendly)"

[[bin]]
name = "bettermq-loadgen"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
reqwest = { workspace = true, features = ["http2"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
hdrhistogram = { version = "7.6.0", default-features = false }
