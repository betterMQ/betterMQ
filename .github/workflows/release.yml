name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump from the latest v* tag. Cargo.toml and OpenAPI on main must already match that version.
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: bettermq

jobs:
  # Version bumps are merged to main by hand. This job only tags HEAD when
  # Cargo.toml and OpenAPI already match the next version; it never creates a
  # chore/release-* branch or pull request.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - id: prepare
        shell: bash
        run: |
          set -euo pipefail
          BUMP="${{ inputs.bump }}"
          LATEST="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          if [[ -z "$LATEST" ]]; then
            BASE="0.1.0"
          else
            BASE="${LATEST#v}"
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "Unknown bump: $BUMP"; exit 1 ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"
          echo "Next release from ${LATEST:-<none>} → ${TAG} (${BUMP})"

          cargo_version="$(awk '
            /^\[workspace.package\]/ { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && /^version = / {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)"
          openapi_version="$(jq -r '.info.version' engine/broker-server/openapi/bettermq.openapi.json)"

          if [[ "$cargo_version" != "$VERSION" || "$openapi_version" != "$VERSION" ]]; then
            echo "::error::main is Cargo.toml=${cargo_version} OpenAPI=${openapi_version}, but this ${BUMP} release expects ${VERSION}."
            echo "Bump both files on main, merge, then re-run Release."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            existing="$(git rev-parse "${TAG}^{commit}")"
            head="$(git rev-parse HEAD)"
            if [[ "$existing" != "$head" ]]; then
              echo "::error::Tag ${TAG} already exists at ${existing}, but HEAD is ${head}."
              echo "Do not move an existing release tag. Use a new bump on main."
              exit 1
            fi
            echo "Tag ${TAG} already points at HEAD"
            echo "push_tag=false" >> "$GITHUB_OUTPUT"
          else
            git tag "$TAG"
            echo "push_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag
        if: steps.prepare.outputs.push_tag == 'true'
        run: git push origin "${{ steps.prepare.outputs.tag }}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: bettermq-linux-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: bettermq-macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: bettermq-macos-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bettermq-windows-amd64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build broker-server
        run: cargo build -p broker-server --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/bettermq.exe" "dist/${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/bettermq" "dist/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  docker:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Image name (lowercase for GHCR)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: selfhost/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=bettermq-release-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=bettermq-release-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name (lowercase for GHCR)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=v${{ needs.prepare.outputs.version }}
            type=raw,value=latest

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.version }}"

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bettermq-*
          merge-multiple: true

      - name: Zip artifacts
        run: |
          cd dist
          for f in *; do
            if [[ -f "$f" && "$f" != *.zip ]]; then
              zip "${f}.zip" "$f"
            fi
          done
          sha256sum *.zip > checksums.txt
          cat checksums.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: BetterMQ ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/checksums.txt
