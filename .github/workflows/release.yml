name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump (from latest v* tag, or 0.1.0 if none)
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: bettermq

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      pr_number: ${{ steps.open_pr.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - id: bump
        shell: bash
        run: |
          set -euo pipefail
          BUMP="${{ inputs.bump }}"
          LATEST="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          if [[ -z "$LATEST" ]]; then
            BASE="0.1.0"
          else
            BASE="${LATEST#v}"
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "Unknown bump: $BUMP"; exit 1 ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${LATEST:-<none>} → ${TAG} (${BUMP})"

      - name: Set workspace version
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          sed -i '/^\[workspace\.package\]/,/^\[/{ s/^version = ".*"/version = "'"${VERSION}"'"/; }' Cargo.toml
          grep -A2 '^\[workspace.package\]' Cargo.toml

      - name: Sync OpenAPI info.version
        run: |
          jq --arg v "${{ steps.bump.outputs.version }}" '.info.version = $v' \
            engine/broker-server/openapi/bettermq.openapi.json > /tmp/openapi.json
          mv /tmp/openapi.json engine/broker-server/openapi/bettermq.openapi.json

      - name: Commit version bump and tag
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.bump.outputs.tag }}"
          git add Cargo.toml engine/broker-server/openapi/bettermq.openapi.json
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit — main already has ${{ steps.bump.outputs.version }}"
          else
            git commit -m "chore(release): ${TAG}"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
          git tag -f "${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # main is protected — never push HEAD:main; use release branch + PR (or tag-only).
      - name: Push release branch and tag
        id: release_branch
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          TAG="${{ steps.commit.outputs.tag }}"
          if [[ "${{ steps.commit.outputs.committed }}" == "true" ]]; then
            BRANCH="chore/release-${TAG}"
            git checkout -b "${BRANCH}"
            git push origin "${BRANCH}" "${TAG}"
            echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          else
            git push origin "${TAG}"
            echo "branch=" >> "$GITHUB_OUTPUT"
            echo "Pushed tag ${TAG} only (version already on main)"
          fi

      - name: Open pull request (merge version bump to main)
        id: open_pr
        if: steps.release_branch.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.bump.outputs.tag }}"
          BRANCH="${{ steps.release_branch.outputs.branch }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Automated version bump from the [Release workflow](${RUN_URL}).

          - Bumps Cargo.toml and OpenAPI info.version to ${{ steps.bump.outputs.version }}
          - Tag ${TAG} is pushed; build + GitHub release follow in this workflow
          - **Merge this PR** so main matches the release tag"
          EXISTING="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "${EXISTING}" ]]; then
            echo "pr_number=${EXISTING}" >> "$GITHUB_OUTPUT"
            echo "PR already open: #${EXISTING}"
            exit 0
          fi
          if ! gh pr create --base main --head "${BRANCH}" --title "chore(release): ${TAG}" --body "${BODY}"; then
            echo "::warning::Could not auto-create PR."
            echo "Enable Settings → Actions → Allow GitHub Actions to create pull requests,"
            echo "or open manually: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            exit 0
          fi
          PR="$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number')"
          echo "pr_number=${PR}" >> "$GITHUB_OUTPUT"
          echo "Open PR #${PR} — merge when ready: ${RUN_URL}"

  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: bettermq-linux-amd64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: bettermq-macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: bettermq-macos-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: bettermq-windows-amd64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      # Pin to rust-toolchain.toml (1.89.0). `@stable` installs the target on a
      # different toolchain, then rustup overrides back to 1.89.0 without it.
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: ${{ matrix.target }}

      - name: Add target to the repo-pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build broker-server
        run: cargo build -p broker-server --release --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/bettermq.exe" "dist/${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/bettermq" "dist/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  docker:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Image name (lowercase for GHCR)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: selfhost/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=bettermq-release-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=bettermq-release-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    needs: [bump, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name (lowercase for GHCR)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=${{ env.REGISTRY }}/${owner}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.bump.outputs.version }}
            type=raw,value=v${{ needs.bump.outputs.version }}
            type=raw,value=latest

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "${{ steps.image.outputs.name }}:${{ needs.bump.outputs.version }}"

  publish:
    needs: [bump, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bettermq-*
          merge-multiple: true

      - name: Zip artifacts
        run: |
          cd dist
          for f in *; do
            if [[ -f "$f" && "$f" != *.zip ]]; then
              zip "${f}.zip" "$f"
            fi
          done
          sha256sum *.zip > checksums.txt
          cat checksums.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump.outputs.tag }}
          name: BetterMQ ${{ needs.bump.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/checksums.txt
